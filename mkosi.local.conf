[Distribution]
Distribution=debian
Release=testing

[Config]
Profiles=flathub,desktop,sway

[Content]
Packages =
        # hardware/drivers
        gdisk
        gvfs-backends
        network-manager-openvpn
        powertop
        p11-kit
        libtpm2-pkcs11-1
        libtpm2-pkcs11-tools
        tpm2-tools
        # mostly for battery health/charge control
        upower

        # networking
        # from the Tailscale repo (SandboxTrees below)
        tailscale

        # shell tools and development
        # SASL PLAIN/LOGIN mechanisms (cyrus-sasl-plain)
        libsasl2-modules
        pastebinit
        # gh: not packaged in Debian
        git-delta
        isync
        krb5-user
        make
        mutt
        neovim
        patch
        restic
        ripgrep
        rsync
        strace
        syncthing
        tig
        w3m

        # bootstrapping mkosi/particleos Debian
        apt-utils
        debian-keyring
        pacman

        # podman
        buildah
        catatonit
        distrobox
        passt
        podman
        skopeo

        # desktop apps
        papers
        flatpak
        # from the Mozilla repo (SandboxTrees below); Debian testing only has firefox-esr
        firefox
        libnotify-bin
        rhythmbox
        rofimoji
        libvte-2.91-0
        lxqt-openssh-askpass
        qt6-wayland

        # sway/wayland desktop
        brightnessctl
        # udev rules, so that brightnessctl works without root
        brightness-udev
        waypipe
        wl-clipboard

# VolatilePackageDirectories=../systemd/build/mkosi.builddir/debian~testing~x86-64

[Build]
# Mozilla apt repo for firefox (non-ESR), Tailscale apt repo
SandboxTrees=
        mkosi.sandbox.mozilla
        mkosi.sandbox.tailscale
# ExtraSearchPaths=../systemd/build

