# Fedora autostarts these through sway-systemd's XDG autostart target;
# Debian does not package sway-systemd, so exec them directly.

# graphical authentication agent for PolicyKit (pkexec, GParted, ...)
exec lxqt-policykit-agent

# NetworkManager tray applet; --indicator selects StatusNotifier, which
# waybar's tray requires (XEmbed does not exist on Wayland)
exec nm-applet --indicator
