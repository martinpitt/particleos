# Debian's default config only includes /etc/sway/config.d/, which is
# immutable on ParticleOS. Let users override keybindings, outputs, etc.
# Fedora does not need this: its layered-include already covers
# ~/.config/sway/config.d/.
include ~/.config/sway/config.d/*
