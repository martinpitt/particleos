# Debian's default config only includes /etc/sway/config-vars.d/, which is
# immutable on ParticleOS. Let users override variables like $mod.
# Fedora does not need this: its layered-include already covers
# ~/.config/sway/config.d/.
include ~/.config/sway/config-vars.d/*
